{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Django App{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <!-- I removed the basic nav with links to home, login and register as I don't think they're needed in the 'base.html' file-->

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; Sky Health Check 2025 </p>
    </footer>

    <script src="{% static 'js/script.js' %}"></script>

</body>
</html>
