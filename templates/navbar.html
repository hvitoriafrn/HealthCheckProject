{% load static %}
<nav>
    <ul>
        <!-- Profile Settings - Visible to All Users -->
        <li>
            <a href="{% url 'profile' %}">
                <img src="{% static 'images/profile.png' %}" alt="Profile Icon" class="icon">
                Profile Settings
            </a>
        </li>

        <!-- Voting Sessions - Only for Engineers and Team Leaders -->
        {% if role == 'engineer' or role == 'team_leader' %}
        <li>
            <a href="{% url 'choose_session' %}">
                <img src="{% static 'images/voting.png' %}" alt="Voting Icon" class="icon">
                Voting Sessions
            </a>
        </li>
        {% endif %}

        <!-- View Team Summary - Visible to All Users -->
        <li>
            <a href="{% url 'vote_summary' %}">
                <img src="{% static 'images/summary.png' %}" alt="Summary Icon" class="icon">
                View Team Summary
            </a>
        </li>
    </ul>
</nav>
