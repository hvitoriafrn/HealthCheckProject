{% extends "base.html" %}
{% load static %} 
{% block content %}
 
<html>
    <style>
        .logout{
            align-items: center;
        }

        /*the code below is Maryam's implementation of logo, copied it to match with the style of home page*/
        /* Logo styling */
        .logo {
            margin-left: 50px; /* changed the margin to match prototype */
            width: 150px;   /* changed it to match prototype size */
            height: auto;   /* Keeps the aspect ratio */
            transition: transform 0.3s; /* For hover effect */
        }
        /* taken from the home page code by Maryam */
        .logo:hover {
            transform: scale(1.05); /* Slight zoom on hover */
        }

        body{
            margin-left: 50px;
        }

        .main{
            margin-left: auto;
            margin-right: auto;
            align-items: center;
            text-align: center;
        }

        .logout{
            margin-top: 20px;
            margin-left: 70%;
        }

     
    </style>

<header>
    <div class="logout">
        <!-- logout button -->
        <a href="{% url 'logout' %}">
            <img src="{% static 'images/logout.svg' %}" alt="Logout button" class="logout">
        </a>
    </div>
    <!-- Sky Logo -->
    <img src="{% static 'images/skyLogo.png' %}" alt="Sky Logo" class="logo">
    
</header>

    <body>
        <div class="main">
            <h2>Welcome to Results Home!</h2>
            <p>This is where users land after logging in.</p>
      
            <h2>this is your dashboard!!!!</h2>

            {% if user.is_authenticated %}
            <p>You are logged in as {{ user.email }}</p>
            {% else %}
            <p>You are not logged in.</p>
            {% endif %}
        </div>
    </body>
</html>
{% endblock %}
