<html>

<!-- minimal styling for this page -->
    <style>
    body {
            font-family: Arial, Helvetica, sans-serif;
        }
        /* container */
        .container {
            margin-top: 200px;
            background-color: white;
            padding: 20px;
            box-shadow: 1px 3px 10px 0px #888888;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
        }

        /* grey text in the box */
        .subtext{
            color: gray;
            font-size: small;
            text-align: left;
            margin-left: 5px;
            margin-right: 5px;
            margin-bottom: 10px;
        }
        
        /* button */
        button{
            padding: 9px;
            font-size: 14px;
            background-color: #ffffff;
            color: rgb(0, 0, 0);
            border-radius: 3px;
            cursor: pointer;
            margin-top: 10px;
            border: black;
            border-style: solid;
            width: 147px;
        }

        /* blue button */
        .buttonBlue{
            padding: 10px;
            font-size: 14px;
            background-color: #038be0;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 10px;
            width: 147px;
        }
        
        h2{
            text-align: center;
        }

        a {
        text-decoration: none;
        }
        
    </style>


<body>
    <!-- main container for logout -->
    <div class="container">
        <h2> See you soon!</h2>
        <div class="subtext">
            <b>Your account has been logged out successfully!</b>
        </div>
        
         <!-- button for back to the home page -->
          <a href="{% url 'home' %}">
         <button name="button" type="submit" class="button">Back to Home Page</button>
         </a>

         <!-- button for login -->
          <a href="{% url 'login' %}">
         <button name="buttonBlue" type="submit" class="buttonBlue">Login</button>
        </a>

    </div>

    </body>
</html>
